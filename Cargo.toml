[package]
name = "image_upscale"
version = "0.1.0"
edition = "2021"
authors = ["Mahmudul Hasan"]
description = "Blazing fast SIMD-accelerated image upscaler and quality enhancer for Linux and Windows developed by Mahmudul Hasan in Rust with Activation Lock"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "rayon"] }
fast_image_resize = "5.5"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
colored = "2.1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image"] }
rfd = "0.15"
open = "5.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
